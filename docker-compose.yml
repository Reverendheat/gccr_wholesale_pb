services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    expose:
      - "8090"
    volumes:
      - pb_data:/app/pb_data
    networks:
      - web
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web
    depends_on:
      - app

volumes:
  pb_data:
  caddy_data:
  caddy_config:

networks:
  web:
